name: Render Keep-Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render's 15-minute idle timeout
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to manually trigger it from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          # Pings the /api/health endpoint to keep the Render instance warm
          curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RENDER_API_URL }}/api/health || true
